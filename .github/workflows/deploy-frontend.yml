name: Deploy Frontend (Next.js) to GCP Ubuntu

on:
  push:
    branches:
      - main
    paths:
      - "FE/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout source code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Install & Build Next.js Frontend
        working-directory: ./FE
        run: |
          npm ci
          npm run build

      - name: 🔍 Debug build output
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== FE directory structure ==="
          ls -la FE
          echo "=== .next directory ==="
          ls -la FE/.next || echo ".next not found"


      - name: 🛠️ Prepare deployment folder on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/myapp
            sudo chown -R $USER:$USER /var/www/myapp
            sudo chmod -R 755 /var/www/myapp

      - name: 🗑️ Cleanup old files on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/myapp/*

      - name: 🚀 Upload Next.js build to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: |
            FE/.next
            FE/public
            FE/package.json
            FE/package-lock.json
          target: /var/www/myapp

      - name: ▶️ Restart Next.js app on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/myapp
            npm ci --omit=dev
            pm2 stop myapp || true
            pm2 start npm --name "myapp" -- run start
            pm2 save
