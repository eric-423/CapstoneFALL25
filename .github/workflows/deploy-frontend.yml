name: Deploy Frontend to GCP Ubuntu

on:
  push:
    branches:
      - main
    paths:
      - "FE/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout source code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Install & Build Next.js Frontend
        working-directory: ./FE
        run: |
          echo "=== Start building FE ==="
          npm ci
          npm run build
          echo "=== List .next directory ==="
          ls -la .next || echo ".next not found!"
          echo "=== Build completed ==="

      - name: 🛠️ Prepare deployment folder on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/myapp
            sudo chown -R $USER:$USER /var/www/myapp
            sudo chmod -R 755 /var/www/myapp
            echo "✅ Deployment folder prepared at /var/www/myapp"

      - name: 🗑️ Cleanup old files on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/myapp/*
            echo "🧹 Old files cleaned up"

      - name: 🚀 Upload Next.js build to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "FE/.next/**,FE/public/**,FE/package.json,FE/package-lock.json"
          target: "/var/www/myapp"
          strip_components: 1
          debug: true
          dotfiles: true

      - name: ✅ Restart app service (optional)
        if: success()
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/myapp
            echo "Installing production dependencies..."
            npm ci --omit=dev
            echo "Restarting app service..."
            pm2 restart myapp || pm2 start npm --name "myapp" -- run start
            echo "✅ Deployment complete!"
