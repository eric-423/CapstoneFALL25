name: Deploy Frontend to GCP Ubuntu
on:
  push:
    branches: [ main ]
    paths:
      - "FE/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Install & Build Next.js Frontend
        working-directory: ./FE
        run: |
          echo "=== Start building FE ==="
          npm ci
          npm run build
          echo "=== Verify .next ==="
          ls -la .next || (echo ".next not found!" && exit 1)
          # SỬA: Tạo file nén ngay trong thư mục hiện tại (FE), không dùng ../
          tar -czf fe-build.tgz .next public package.json package-lock.json
          echo "=== Build archived to fe-build.tgz ==="

      - name: 🛠️ Prepare deployment folder on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/myapp
            sudo chown -R $USER:$USER /var/www/myapp
            sudo chmod -R 755 /var/www/myapp

      - name: 📤 Upload build archive to TEMP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "FE/fe-build.tgz"
          target: "/tmp" # SỬA: Upload vào thư mục tạm để tránh bị xóa nhầm
          strip_components: 1 # Loại bỏ prefix "FE/" khi upload

      - name: ♻️ Unpack, install deps & restart (systemd)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # === BẮT ĐẦU ĐOẠN FIX NVM ===
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # Load NVM
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion" 
            
            # Nếu dùng ~/.profile hoặc ~/.bashrc thì load luôn cho chắc
            source ~/.profile || true
            source ~/.bashrc || true
            
            # Kiểm tra xem đã có npm chưa
            echo "Node path: $(which node)"
            echo "NPM path: $(which npm)"
            # === KẾT THÚC ĐOẠN FIX NVM ===

            set -e
            cd /var/www/myapp
            
            echo "🧹 Cleaning old files..."
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            
            echo "🚚 Moving build from tmp..."
            mv /tmp/fe-build.tgz .
            
            tar -xzf fe-build.tgz
            rm -f fe-build.tgz
            
            echo "📦 Installing dependencies..."
            # Dùng đường dẫn tuyệt đối của npm nếu lệnh trên đã tìm thấy, hoặc dùng npm thường
            npm ci --production
            
            echo "🔄 Restarting Service..."
            sudo systemctl restart myapp.service || (echo "❌ myapp.service not found." && exit 1)
            
            echo "✅ Deployment complete!"
