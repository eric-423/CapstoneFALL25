name: Build Mobile APK and upload to Google Drive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK for module Mobile
        # Nếu module của bạn tên khác (Internal_Mobile), đổi thành :Internal_Mobile:assembleDebug
        run: |
          ./gradlew clean :Mobile:assembleDebug --no-daemon --stacktrace

      - name: Find APK path (module Mobile)
        id: find_apk
        run: |
          # ưu tiên đường dẫn chuẩn của Gradle outputs
          expected_paths=(
            "$GITHUB_WORKSPACE/Mobile/build/outputs/apk/debug/app-debug.apk"
            "$GITHUB_WORKSPACE/Mobile/build/outputs/apk/debug/*-debug.apk"
            "$GITHUB_WORKSPACE/Mobile/build/outputs/apk/*/debug/*.apk"
          )
          apk_path=""
          for p in "${expected_paths[@]}"; do
            # expand possible glob
            files=( $p )
            if [ ${#files[@]} -gt 0 ] && [ -f "${files[0]}" ]; then
              apk_path="${files[0]}"
              break
            fi
          done

          # nếu vẫn chưa tìm thấy, fallback tìm toàn repo
          if [ -z "$apk_path" ]; then
            apk_path=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | grep "/Mobile/" | head -n 1)
          fi

          if [ -z "$apk_path" ]; then
            echo "No APK found under Mobile module. Listing build folder for debug:"
            ls -la Mobile/build || true
            exit 1
          fi

          echo "Found APK: $apk_path"
          echo "::set-output name=apk::$apk_path"

      - name: Upload artifact to Actions (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: ${{ steps.find_apk.outputs.apk }}

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Restore Google service account JSON from secret
        env:
          DRIVE_SERVICE_KEY_BASE64: ${{ secrets.DRIVE_SERVICE_KEY_BASE64 }}
        run: |
          if [ -z "$DRIVE_SERVICE_KEY_BASE64" ]; then
            echo "Missing DRIVE_SERVICE_KEY_BASE64 secret"
            exit 1
          fi
          echo "$DRIVE_SERVICE_KEY_BASE64" | base64 --decode > service-account.json
          echo "Service account json restored (first 200 chars):"
          head -c 200 service-account.json || true

      - name: Configure rclone remote (gdrive)
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # create a new remote 'gdrive' using the service account file
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            rclone config create gdrive drive service_account_file=service-account.json root_folder_id=$DRIVE_FOLDER_ID scope=drive.file --drive-acknowledge-abuse
          else
            rclone config create gdrive drive service_account_file=service-account.json scope=drive.file --drive-acknowledge-abuse
          fi
          echo "rclone remote 'gdrive' configured."

      - name: Upload APK to Google Drive
        run: |
          APK="${{ steps.find_apk.outputs.apk }}"
          echo "Uploading $APK to Google Drive..."
          if [ -n "${{ secrets.DRIVE_FOLDER_ID }}" ]; then
            # upload to the folder id
            # rclone supports --drive-root-folder-id for target folder
            rclone copy "$APK" gdrive: --drive-root-folder-id=${{ secrets.DRIVE_FOLDER_ID }} -P
          else
            # upload into Apps/Builds (will create folder)
            rclone copy "$APK" gdrive:Apps/Builds -P
          fi
          echo "Upload finished."
