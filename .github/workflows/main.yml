name: Build React Native Android (Mobile) and upload to Google Drive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (cmdline tools, platform-tools)
        uses: android-actions/setup-android@v3
        with:
          api-levels: 33
          build-tools: "33.0.2"
          ndk: 23.1.7779620
          components: "platform-tools,platforms;android-33,build-tools;33.0.2"
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: |
          if [ -f "./Mobile/android/gradlew" ]; then chmod +x ./Mobile/android/gradlew; fi

      - name: Build debug APK (React Native Mobile)
        run: |
          # nếu project React Native root is repository root and android folder is Mobile/android
          cd Mobile/android
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        working-directory: .

      - name: Find APK path
        id: find_apk
        run: |
          # thường apk sẽ ở Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          APK="$(find $GITHUB_WORKSPACE -type f -path '*/Mobile/android/app/build/outputs/apk/*/debug/*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "No APK found in Mobile/android outputs; listing Mobile/android/app/build:"
            ls -la Mobile/android/app/build || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "::set-output name=apk::$APK"

      - name: Upload artifact to Actions (backup)
        uses: actions/upload-artifact@v4
        with:
          name: rn-mobile-apk
          path: ${{ steps.find_apk.outputs.apk }}

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Restore Google service account JSON from secret
        env:
          DRIVE_SERVICE_KEY_BASE64: ${{ secrets.DRIVE_SERVICE_KEY_BASE64 }}
        run: |
          if [ -z "$DRIVE_SERVICE_KEY_BASE64" ]; then
            echo "Missing DRIVE_SERVICE_KEY_BASE64 secret"
            exit 1
          fi
          echo "$DRIVE_SERVICE_KEY_BASE64" | base64 --decode > service-account.json
          echo "Service account json restored (first 200 chars):"
          head -c 200 service-account.json || true

      - name: Configure rclone remote (gdrive)
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # configure non-interactive remote 'gdrive'
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            rclone config create gdrive drive service_account_file=service-account.json root_folder_id=$DRIVE_FOLDER_ID scope=drive.file --drive-acknowledge-abuse
          else
            rclone config create gdrive drive service_account_file=service-account.json scope=drive.file --drive-acknowledge-abuse
          fi
          echo "rclone remote 'gdrive' configured."

      - name: Upload APK to Google Drive
        run: |
          APK="${{ steps.find_apk.outputs.apk }}"
          echo "Uploading $APK to Google Drive..."
          if [ -n "${{ secrets.DRIVE_FOLDER_ID }}" ]; then
            rclone copy "$APK" gdrive: --drive-root-folder-id=${{ secrets.DRIVE_FOLDER_ID }} -P
          else
            rclone copy "$APK" gdrive:Apps/Builds -P
          fi
          echo "Upload finished."
